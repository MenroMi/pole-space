name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: yarn prisma generate
        env:
          DATABASE_URL: postgresql://x:x@localhost/x
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: '0'
      - run: yarn prisma generate
        env:
          DATABASE_URL: postgresql://x:x@localhost/x
      - run: yarn build
        env:
          DATABASE_URL: postgresql://x:x@localhost/x
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: placeholder
          GOOGLE_CLIENT_SECRET: placeholder
          FACEBOOK_CLIENT_ID: placeholder
          FACEBOOK_CLIENT_SECRET: placeholder
          RESEND_API_KEY: placeholder
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          HUSKY: '0'
      # `yarn audit` (Classic) exit code is a severity bitmask: 8=high, 16=critical.
      # Fail only on high+ to mirror npm's `--audit-level=high`.
      - name: Audit (high and above)
        run: |
          yarn audit --level high || code=$?
          if [ $(( ${code:-0} & 24 )) -ne 0 ]; then
            echo "High or critical vulnerabilities found"
            exit 1
          fi
